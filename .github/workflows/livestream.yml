name: Replay Stream XSMN 27/09/2026 to Facebook Live

on:
  workflow_dispatch: # Bấm "Run workflow" để chạy phát lại ngay lập tức

permissions:
  contents: read

concurrency:
  group: fb-live-xsmn-replay
  cancel-in-progress: false

jobs:
  live_stream:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: https://kqxs-phuocdanh-api.vercel.app
      LIVE_PATH: /live?stream=1&date=2026-09-27
      API_PATH: /api/kqxs/today
      REGION_TITLE: Miền Nam
      REGION_SHORT: XSMN
      TARGET_DATE: '27/09/2026'
      GRAPH: https://graph.facebook.com/v23.0
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài FFmpeg, Xvfb, jq và font emoji
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && \
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              ffmpeg xvfb x11-utils jq fonts-noto-color-emoji && break
            echo "apt lỗi, thử lại lần $i"; sleep 10
          done
          ffmpeg -hide_banner -version | head -1

      - name: Cache Chrome của Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-24-${{ runner.os }}

      - name: Cài Puppeteer
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            npm install --no-save --no-audit --no-fund puppeteer@24 && break
            echo "npm lỗi, thử lại lần $i"; sleep 10
          done
          node -e "require('puppeteer')"

      - name: Tải nhạc nền về máy
        timeout-minutes: 5
        run: |
          MUSIC_URL=$(curl -fsS --retry 5 --retry-all-errors --max-time 20 "$BASE_URL$API_PATH" | jq -r '.musicUrl // empty' || true)
          [ -z "$MUSIC_URL" ] && MUSIC_URL="$BASE_URL/audio/xo-so-live-bed.mp3"
          if curl -fsSL --retry 5 --retry-all-errors --max-time 60 "$MUSIC_URL" -o "$RUNNER_TEMP/bed.mp3"; then
            ls -lh "$RUNNER_TEMP/bed.mp3"
          else
            echo "::warning::Không tải được nhạc nền — Live vẫn phát, nhưng không có nhạc"
          fi
          echo "MUSIC_FILE=$RUNNER_TEMP/bed.mp3" >> "$GITHUB_ENV"

      - name: Tạo Facebook Live (Phát lại 27/09/2026)
        timeout-minutes: 5
        run: |
          LOW_LATENCY=(--data-urlencode "is_low_latency=true")
          for i in 1 2 3; do
            RESPONSE=$(curl -s --max-time 30 -X POST "$GRAPH/${{ secrets.PAGE_ID }}/live_videos" \
              --data-urlencode "status=LIVE_NOW" \
              "${LOW_LATENCY[@]}" \
              --data-urlencode "title=🔴 [PHÁT LẠI] KQXS $REGION_TITLE NGÀY $TARGET_DATE – Phước Danh" \
              --data-urlencode "description=Phát lại kết quả xổ số ngày $TARGET_DATE · Đại lý vé số Phước Danh · Hotline 0919.494.566 · vesophuocdanh.vn" \
              --data-urlencode "access_token=${{ secrets.PAGE_TOKEN }}" || true)
            LIVE_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null || true)
            RTMP_URL=$(echo "$RESPONSE" | jq -r '.secure_stream_url // empty' 2>/dev/null || true)
            [ -n "$LIVE_ID" ] && [ -n "$RTMP_URL" ] && break
            echo "$RESPONSE" | grep -qi "is_low_latency" && LOW_LATENCY=()
            echo "Tạo Live lần $i lỗi: $(echo "$RESPONSE" | jq -c '.error // .' 2>/dev/null || echo "$RESPONSE")"
            sleep 10
          done
          if [ -z "$LIVE_ID" ] || [ -z "$RTMP_URL" ]; then
            echo "::error::Facebook không tạo được Live"
            exit 1
          fi
          echo "::add-mask::$RTMP_URL"
          echo "LIVE_ID=$LIVE_ID" >> "$GITHUB_ENV"
          echo "RTMP_URL=$RTMP_URL" >> "$GITHUB_ENV"
          echo "Đã tạo Live $LIVE_ID"

      - name: Phát Live
        timeout-minutes: 75
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 720x1280x24 -ac -nolisten tcp &
          for i in $(seq 1 20); do
            xdpyinfo -display :99 > /dev/null 2>&1 && break
            sleep 0.5
          done
          xdpyinfo -display :99 > /dev/null 2>&1 || { echo "::error::Xvfb không khởi động được"; exit 1; }
          cp stream.js stream.cjs
          node stream.cjs

      - name: Lưu ảnh khung hình đã phát
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-frames
          path: frames/
          if-no-files-found: ignore
          retention-days: 7

      - name: Đảm bảo đóng Live (giữ VOD)
        if: always() && env.LIVE_ID != ''
        timeout-minutes: 2
        run: |
          curl -s --retry 3 --retry-all-errors --max-time 20 -X POST "$GRAPH/$LIVE_ID" \
            -d "end_live_video=true" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}" > /dev/null || true
