name: Auto Stream XSMN to Facebook Live

on:
  schedule:
    # 16:12 Giờ VN (Asia/Ho_Chi_Minh = UTC+7) => 09:12 UTC
    - cron: '12 9 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" chạy test thủ công bất kỳ lúc nào

jobs:
  live_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt FFmpeg và Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Cài đặt thư viện Puppeteer
        run: npm install puppeteer

      - name: Gọi Facebook Graph API lấy Live Stream URL
        id: fb_live
        run: |
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v19.0/${{ secrets.PAGE_ID }}/live_videos" \
            -d "status=LIVE_NOW" \
            -d "title=🔴 KQXS Miền Nam LIVE – Phước Danh" \
            -d "description=Đang xổ trực tiếp · Đại lý vé số Phước Danh · Hotline 0919.494.566 · vesophuocdanh.vn" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}")
          
          SECURE_STREAM_URL=$(echo $RESPONSE | jq -r '.secure_stream_url')
          LIVE_ID=$(echo $RESPONSE | jq -r '.id')
          
          echo "LIVE_ID=$LIVE_ID" >> $GITHUB_ENV
          echo "RTMP_URL=$SECURE_STREAM_URL" >> $GITHUB_ENV
          echo "Stream URL đã khởi tạo thành công."

      - name: Khởi chạy Stream trực tiếp
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          LIVE_ID: ${{ env.LIVE_ID }}
          RTMP_URL: ${{ env.RTMP_URL }}
        run: |
          # Ép màn hình ảo độ phân giải dọc 720x1280
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          node stream.js

      - name: Kết thúc Live và Giữ VOD trên Fanpage
        if: always()
        run: |
          echo "Kiểm tra và đảm bảo phiên Live đã đóng để chuyển thành video VOD..."
          curl -s -X POST "https://graph.facebook.com/v19.0/${{ env.LIVE_ID }}" \
            -d "end_live_video=true" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}"
