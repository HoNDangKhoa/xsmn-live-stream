name: Auto Stream XSMN to Facebook Live

on:
  schedule:
    # 15:45 giờ VN (08:45 UTC). Lịch GitHub hay trễ 5–20 phút nên chạy sớm;
    # bước "Chờ tới 16:08" canh đúng giờ mới tạo Live.
    - cron: '45 8 * * *'
  workflow_dispatch: # bấm tay để test: tạo Live ngay, không chờ giờ

concurrency:
  group: fb-live-xsmn
  cancel-in-progress: false

jobs:
  live_stream:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: https://kqxs-phuocdanh-api.vercel.app
      LIVE_PATH: /live
      API_PATH: /api/kqxs/today
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài FFmpeg, Xvfb, jq và font emoji
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb jq fonts-noto-color-emoji

      - name: Cài Puppeteer
        run: npm install puppeteer@24

      - name: Tải nhạc nền về máy
        run: |
          MUSIC_URL=$(curl -fsS "$BASE_URL$API_PATH" | jq -r '.musicUrl // empty')
          if [ -z "$MUSIC_URL" ]; then
            MUSIC_URL="$BASE_URL/audio/xo-so-live-bed.mp3"
          fi
          curl -fsSL "$MUSIC_URL" -o "$RUNNER_TEMP/bed.mp3"
          ls -lh "$RUNNER_TEMP/bed.mp3"
          echo "MUSIC_FILE=$RUNNER_TEMP/bed.mp3" >> "$GITHUB_ENV"

      - name: Chờ tới 16:08 giờ VN
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(TZ=Asia/Ho_Chi_Minh date -d 'today 16:08' +%s)
          NOW=$(date +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Chờ $((TARGET - NOW)) giây tới 16:08"
            sleep $((TARGET - NOW))
          fi

      - name: Tạo Facebook Live
        run: |
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v19.0/${{ secrets.PAGE_ID }}/live_videos" \
            --data-urlencode "status=LIVE_NOW" \
            --data-urlencode "is_low_latency=true" \
            --data-urlencode "title=🔴 KQXS Miền Nam LIVE $TODAY – Phước Danh" \
            --data-urlencode "description=Đang phát trực tiếp XSMN · Đại lý vé số Phước Danh · Hotline 0919.494.566 · vesophuocdanh.vn" \
            --data-urlencode "access_token=${{ secrets.PAGE_TOKEN }}")

          LIVE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          RTMP_URL=$(echo "$RESPONSE" | jq -r '.secure_stream_url // empty')
          if [ -z "$LIVE_ID" ] || [ -z "$RTMP_URL" ]; then
            echo "::error::Facebook không tạo được Live: $(echo "$RESPONSE" | jq -c '.error // .')"
            exit 1
          fi

          echo "::add-mask::$RTMP_URL"
          echo "LIVE_ID=$LIVE_ID" >> "$GITHUB_ENV"
          echo "RTMP_URL=$RTMP_URL" >> "$GITHUB_ENV"
          echo "Đã tạo Live $LIVE_ID"

      - name: Phát Live (bảng /live?stream=1 + nhạc nền)
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
        run: |
          Xvfb :99 -screen 0 720x1280x24 -ac -nolisten tcp &
          sleep 2
          export DISPLAY=:99
          node stream.js

      - name: Lưu ảnh khung hình đã phát
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-frames
          path: frames/
          if-no-files-found: ignore

      - name: Đảm bảo đóng Live (giữ VOD)
        if: always() && env.LIVE_ID != ''
        run: |
          curl -s -X POST "https://graph.facebook.com/v19.0/$LIVE_ID" \
            -d "end_live_video=true" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}" > /dev/null || true
