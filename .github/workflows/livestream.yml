name: Auto Stream XSMN to Facebook Live

on:
  schedule:
    # 16:10 Giờ VN (UTC+7) tương ứng 09:10 UTC (sớm hơn 5 phút trước giờ mở thưởng 16:15)
    - cron: '10 9 * * *'
  workflow_dispatch: # Cho phép bấm test thủ công bất kỳ lúc nào

jobs:
  live_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt FFmpeg và Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb jq

      - name: Cài đặt thư viện Puppeteer
        run: npm install puppeteer

      - name: Tạo ngày hôm nay (Giờ VN)
        id: date_step
        run: |
          TODAY=$(TZ="Asia/Ho_Chi_Minh" date +"%d/%m/%Y")
          echo "TODAY=$TODAY" >> $GITHUB_ENV

      - name: Gọi Facebook Graph API lấy Live Stream URL (Low Latency)
        id: fb_live
        run: |
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v19.0/${{ secrets.PAGE_ID }}/live_videos" \
            -d "status=LIVE_NOW" \
            -d "is_low_latency=true" \
            -d "title=🔴 KQXS Miền Nam LIVE ${{ env.TODAY }} – Phước Danh" \
            -d "description=Đang phát trực tiếp XSMN · Đại lý vé số Phước Danh · Hotline 0919.494.566 · vesophuocdanh.vn" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}")
          
          SECURE_STREAM_URL=$(echo $RESPONSE | jq -r '.secure_stream_url')
          LIVE_ID=$(echo $RESPONSE | jq -r '.id')
          
          echo "LIVE_ID=$LIVE_ID" >> $GITHUB_ENV
          echo "RTMP_URL=$SECURE_STREAM_URL" >> $GITHUB_ENV
          echo "Stream URL đã khởi tạo thành công."

      - name: Khởi chạy Stream trực tiếp kèm Nhạc nền
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          LIVE_ID: ${{ env.LIVE_ID }}
          RTMP_URL: ${{ env.RTMP_URL }}
        run: |
          # 1. Lấy link nhạc nền trực tiếp từ API Vercel
          MUSIC_URL=$(curl -s https://kqxs-phuocdanh-api.vercel.app/api/kqxs/today | jq -r '.musicUrl // empty')
          if [ -z "$MUSIC_URL" ] || [ "$MUSIC_URL" = "null" ]; then
            MUSIC_URL="https://kqxs-phuocdanh-api.vercel.app/audio/xo-so-live-bed.mp3"
          fi
          echo "Nhạc nền phát sóng: $MUSIC_URL"
          export MUSIC_URL=$MUSIC_URL

          # 2. Khởi tạo màn hình ảo chuẩn tỷ lệ dọc 720x1280
          Xvfb :99 -screen 0 720x1280x24 &
          export DISPLAY=:99
          node stream.js

      - name: Kết thúc Live và Giữ VOD trên Fanpage
        if: always()
        run: |
          echo "Đảm bảo phiên Live đã đóng an toàn để chuyển thành VOD..."
          curl -s -X POST "https://graph.facebook.com/v19.0/${{ env.LIVE_ID }}" \
            -d "end_live_video=true" \
            -d "access_token=${{ secrets.PAGE_TOKEN }}"
